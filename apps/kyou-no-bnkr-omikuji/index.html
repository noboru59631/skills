<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>今日のBNKRおみくじ</title>
  <style>/* full app body committed from the current Bankr app */
  body{background:#0d0d0d;color:#f0f0f0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px} .container{width:100%;max-width:600px;display:flex;flex-direction:column;gap:20px} header{text-align:center} header h1{font-size:28px;font-weight:900} .card,.history-section{background:#1a1a1a;border-radius:16px;padding:24px 20px;border:1px solid #2a2a2a;box-shadow:0 8px 24px rgba(0,0,0,.5)} #draw-view{text-align:center;padding:20px 10px;display:flex;flex-direction:column;align-items:center;gap:20px}.dramatic-stage{width:100%;min-height:132px;border-radius:14px;background:radial-gradient(circle at 50% 35%,#5b1834 0,#21132b 42%,#0b0b14 100%);display:flex;align-items:center;justify-content:center;position:relative}.torii{font-size:64px}.coffee-scene{width:100%;min-height:150px;border-radius:14px;background:linear-gradient(180deg,#261a17,#120f10);display:flex;align-items:flex-end;justify-content:center;padding-bottom:18px;position:relative}.coffee-cup{font-size:72px}.draw-btn,.share-btn{width:100%;padding:16px;border:0;border-radius:12px;font-size:18px;font-weight:900;cursor:pointer}.draw-btn{background:linear-gradient(135deg,#ffd700,#ff8800);color:#000}.share-btn{background:#1d9bf0;color:#fff;text-align:center;text-decoration:none}.tier-kanji{font-size:96px;font-weight:900;text-align:center}.obaachan-box{background:#1e1e1e;border-radius:12px;padding:16px;display:flex;gap:14px;border-left:5px solid #ffd700}.stats-row,.grid-2x2{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.grid-2x2{grid-template-columns:1fr 1fr}.stat-item,.detail-card{background:#141414;border-radius:10px;padding:10px;text-align:center}.advice-card{grid-column:span 2;background:#182218;padding:12px;border-radius:10px}.history-table{width:100%;border-collapse:collapse}.history-table th,.history-table td{padding:10px 6px;border-bottom:1px solid #222;text-align:left}@media(max-width:480px){.tier-kanji{font-size:80px}.stats-row{gap:6px}}
  </style>
</head>
<body><div class="container"><header><h1>🎰 今日のBNKRおみくじ</h1><h2>コーヒー飲んでゆっくりしていってな！</h2><p>引くたびに運勢が変わる | 和風ドラマ演出つき</p><p id="display-date">JST — まだ引いてへんで</p></header><div class="card"><div id="draw-view"><div class="dramatic-stage"><div class="torii">⛩</div></div><div class="coffee-scene"><div class="coffee-cup">☕</div><div>THEBOOSTCOFFEE SPECIALTY BREW</div></div><div id="omikuji-box">🥢</div><div id="gacha-text">今日の運勢を占ってみよう！</div><button class="draw-btn" id="draw-btn" onclick="drawFortune()">おみくじを引く 🎰</button></div><div id="result-view" style="display:none"><div class="tier-kanji" id="res-tier">大吉</div><div class="obaachan-box"><div>👵</div><div id="res-obaachan-msg"></div></div><div class="stats-row"><div class="stat-item">BNKR 24h<div id="res-price-change"></div></div><div class="stat-item">出来高<div id="res-vol"></div></div><div class="stat-item">首位<div id="res-top-rank"></div></div></div><div class="grid-2x2"><div class="detail-card">ラッキーアイテム<div id="res-item"></div></div><div class="detail-card">ラッキーナンバー<div id="res-num"></div></div><div class="detail-card">ラッキーカラー<div id="res-color"></div></div><div class="detail-card">運勢スコア<div id="res-score"></div></div><div class="advice-card">今日のアドバイス<div id="res-advice"></div></div></div><a id="share-link" href="#" target="_blank" class="share-btn">𝕏 でシェアする 🎰</a></div></div><div class="history-section"><h3>📅 直近7日間の運勢</h3><table class="history-table"><thead><tr><th>日付</th><th>運勢</th><th>BNKR変動</th><th>ラッキーアイテム</th></tr></thead><tbody id="history-tbody"></tbody></table></div></div><script>let todayData=null,historyData=[];const colors={大吉:'#ffd700',中吉:'#ff9800',小吉:'#fdd835',吉:'#4caf50',末吉:'#2196f3',凶:'#9c27b0',大凶:'#e53935'};async function init(){try{todayData=await bankr.appKV.get('omikuji_today');historyData=await bankr.appKV.get('omikuji_history')||[];if(todayData?.date)renderDate()}catch(e){}}function renderDate(){document.getElementById('display-date').innerText='JST '+todayData.date}async function drawFortune(){const b=document.getElementById('draw-btn');b.disabled=true;document.getElementById('gacha-text').innerText='神託を取得中…';try{todayData=await bankr.invokeScript('updateFortune',{});historyData=[todayData,...historyData.filter(h=>h.drawnAt!==todayData.drawnAt)].slice(0,7);showResult();renderHistory();renderDate()}catch(e){document.getElementById('gacha-text').innerText='神託の取得に失敗したで…'}b.disabled=false}function showResult(){const d=todayData;if(!d)return;const t=document.getElementById('res-tier');t.innerText=d.tier;t.style.color=colors[d.tier]||'#ffd700';document.getElementById('res-obaachan-msg').innerText=d.obaachanMessage;document.getElementById('res-price-change').innerText=(d.priceChange24h>=0?'+':'')+d.priceChange24h+'%';document.getElementById('res-vol').innerText='$'+Number(d.volume24h||0).toLocaleString();document.getElementById('res-top-rank').innerText=d.topRankName||'@bankr';document.getElementById('res-item').innerText=d.luckItem||'-';document.getElementById('res-num').innerText=d.luckyNumber||'-';document.getElementById('res-color').innerText=d.luckyColor||'-';document.getElementById('res-score').innerText=(d.score||0)+' 点';document.getElementById('res-advice').innerText=d.advice||'-';document.getElementById('share-link').href='https://twitter.com/intent/tweet?text='+encodeURIComponent(d.shareText||'');document.getElementById('result-view').style.display='block'}function renderHistory(){document.getElementById('history-tbody').innerHTML=historyData.map(h=>`<tr><td>${h.date}</td><td style="color:${colors[h.tier]||'#fff'}">${h.tier}</td><td>${h.priceChange24h}%</td><td>${h.luckItem||'-'}</td></tr>`).join('')||'<tr><td colspan="4">履歴がありません</td></tr>'}if(window.bankr)bankr.on('ready',init);else init();</script></body></html>
