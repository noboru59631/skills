<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BNKR Leaderboard Live</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #0d0d0d; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif; padding: 16px; padding-bottom: 60px; min-height: 100vh; }
    .container { max-width: 1200px; margin: 0 auto; }
    header { background: #1a1a1a; border-radius: 12px; padding: 20px 24px; margin-bottom: 20px; border: 1px solid #2a2a2a; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px; }
    .header-titles h1 { font-size: 1.6rem; font-weight: 800; color: #ffffff; display: flex; align-items: center; gap: 8px; }
    .header-titles p { color: #888888; font-size: 0.9rem; margin-top: 4px; }
    .header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
    .header-meta { text-align: right; font-size: 0.85rem; color: #aaaaaa; }
    .header-meta .timer { display: inline-block; margin-top: 6px; background: rgba(245, 197, 24, 0.15); color: #f5c518; border: 1px solid rgba(245, 197, 24, 0.3); padding: 4px 10px; border-radius: 20px; font-weight: 600; font-size: 0.8rem; }
    .share-x-btn { background: #000000; color: #ffffff; border: 1px solid #444444; padding: 8px 16px; border-radius: 20px; font-weight: 700; font-size: 0.85rem; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: all 0.2s ease; box-shadow: 0 2px 8px rgba(0,0,0,0.4); }
    .share-x-btn:hover { background: #111111; border-color: #f5c518; color: #f5c518; transform: translateY(-1px); }
    .table-card { background: #1a1a1a; border-radius: 12px; border: 1px solid #2a2a2a; overflow-x: auto; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; min-width: 950px; }
    th { background: #141414; color: #888888; font-weight: 600; padding: 14px 16px; border-bottom: 1px solid #2a2a2a; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.05em; }
    td { padding: 14px 16px; border-bottom: 1px solid #222222; vertical-align: middle; transition: background 0.2s ease; }
    tbody tr:nth-child(even) { background: rgba(255, 255, 255, 0.015); } tbody tr:hover { background: rgba(255, 255, 255, 0.04); }
    tr.rank-1 { border-left: 4px solid #f5c518; } tr.rank-2 { border-left: 4px solid #c0c0c0; } tr.rank-3 { border-left: 4px solid #cd7f32; } tr.rank-up-big { border-left: 4px solid #00d170; } tr.rank-down-big { border-left: 4px solid #ff4444; }
    @keyframes greenFlash { 0% { background-color: rgba(0, 209, 112, 0.45); } 100% { background-color: transparent; } } tr.flash-rank-up { animation: greenFlash 0.5s ease-out forwards; }
    .rank-cell { font-size: 1.1rem; font-weight: 700; display: flex; align-items: center; gap: 6px; } .change-up { color: #00d170; font-weight: 700; } .change-down { color: #ff4444; font-weight: 700; } .change-same { color: #666666; } .change-new { color: #a855f7; font-weight: 700; }
    .username-cell { font-weight: 600; color: #ffffff; } .score-cell { color: #f5c518; font-weight: 700; font-size: 1rem; font-family: monospace, sans-serif; } .stat-sec { color: #888888; font-size: 0.82rem; font-family: monospace, sans-serif; }
    @keyframes commentaryGlow { 0% { transform: scale(0.98); opacity: 0.85; } 100% { transform: scale(1); opacity: 1; } } .commentary-cell { color: #ffffff; font-size: 1.05rem; font-weight: 700; line-height: 1.4; max-width: 380px; display: inline-block; animation: commentaryGlow 0.4s ease-out forwards; background: linear-gradient(90deg, #ffffff 0%, #f5c518 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 0 12px rgba(245, 197, 24, 0.15); }
    .ticker-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: #111111; border-top: 1px solid #333333; height: 40px; display: flex; align-items: center; overflow: hidden; z-index: 1000; } .ticker-wrapper { width: 100%; overflow: hidden; white-space: nowrap; } .ticker-content { display: inline-block; white-space: nowrap; padding-left: 100%; animation: ticker 35s linear infinite; font-size: 0.85rem; color: #dddddd; font-weight: 500; } @keyframes ticker { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(-100%, 0, 0); } }
    footer { margin-top: 24px; text-align: center; font-size: 0.8rem; color: #666666; display: flex; justify-content: center; align-items: center; gap: 12px; } footer a { color: #f5c518; text-decoration: none; } footer a:hover { text-decoration: underline; } .loading-container { text-align: center; padding: 40px; color: #888; }
  </style>
</head>
<body>
  <div class="container"><header><div class="header-titles"><h1>🏆 BNKR リーダーボード実況</h1><p>Bankr Club Member Rankings — Live Commentary</p></div><div class="header-right"><button class="share-x-btn" onclick="shareOnX()">𝕏 でシェア</button><div class="header-meta"><div id="updated-at">最終更新: --:--:-- JST</div><div class="timer">⏱️ 次回更新まで <span id="countdown">900</span> 秒</div></div></div></header><div class="table-card"><table><thead><tr><th>Rank</th><th>Change</th><th>Username</th><th>$BNKR Score</th><th>Deployer</th><th>Builder</th><th>Social</th><th>PNL</th><th>Commentary</th></tr></thead><tbody id="leaderboard-body"><tr><td colspan="9" class="loading-container">データを読み込み中...</td></tr></tbody></table></div><footer><span>Powered by @noboru × @bankrbot</span><span>•</span><a href="https://bankr.bot/leaderboard" target="_blank" rel="noopener">bankr.bot/leaderboard</a></footer></div><div class="ticker-bar"><div class="ticker-wrapper"><div class="ticker-content" id="ticker-text">🔴 LIVE | データ更新中...</div></div></div>
  <script>
    let secondsLeft=900,currentTopUser="???";
    function getCommentary(rank,change,isNew){if(isNew)return "🆕 ランクイン！新たなライバル登場だ！";if(rank===1){if(change===0)return "👑 王者に死角なし！今日も圧倒的な首位をキープ！";if(change>0)return "🚀 首位奪取！！王座に就いた！歴史的瞬間だ！"}if(change>=5)return `⚡ 大爆上げ！一気に${change}ランクジャンプ！何が起きてるんだ！`;if(change>=2)return `📈 じわじわ上昇中…${change}ランクアップ！勢いが止まらない！`;if(change===1)return `🔥 一歩一歩、着実に前進！${rank}位まで迫った！`;if(change<=-5)return `💀 まさかの${Math.abs(change)}ランク急落…何があったんだ！！`;if(change<=-2)return `😰 後退…${Math.abs(change)}ランクダウン。巻き返しに期待！`;if(change===-1)return `😤 1ランク後退…まだまだ諦めるな！`;if(rank<=5)return "🛡️ 上位をしっかりキープ！安定感がさすが！";if(rank<=10)return "⚔️ 追い上げを待つ構え。次の15分が勝負だ！";return "💪 まだ上を目指せる！Top10まで届け！"}
    const formatNumber=n=>!n&&n!==0?"0":Number(n).toLocaleString();const formatJST=s=>{if(!s)return "直近";try{return new Date(s).toLocaleTimeString("ja-JP",{hour12:false})+" JST"}catch(e){return "直近"}};
    function shareOnX(){const u=window.location.href.includes('http')?window.location.href:'https://bankr.bot/u/0x7b9af3d72ad97aa15db0e0cc6c1b747904653645/apps/bnkr-leaderboard-live';window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(`🏆 BNKR リーダーボード実況！現在の首位は@${currentTopUser}！ #BNKR @bankrbot ${u}`)}`,'_blank')}
    async function loadLeaderboardData(){try{const [snapshot,prevSnapshot,meta]=await Promise.all([bankr.appKV.get('leaderboard_snapshot'),bankr.appKV.get('leaderboard_prev_snapshot'),bankr.appKV.get('meta.refreshedAt')]);if(!snapshot||!Array.isArray(snapshot)||!snapshot.length){document.getElementById('leaderboard-body').innerHTML='<tr><td colspan="9" style="text-align:center;padding:30px;color:#888">データがありません。バックエンドスクリプトを実行してください。</td></tr>';return}const prev=new Map();if(Array.isArray(prevSnapshot))prevSnapshot.forEach(x=>{if(x.username)prev.set(x.username,x.rank)});const tbody=document.getElementById('leaderboard-body');tbody.innerHTML='';let ticks=[];currentTopUser=snapshot[0]?.username||'unknown';ticks.push(`🔴 LIVE | 現在の首位は @${currentTopUser} ！`);snapshot.forEach((row,index)=>{const rank=index+1,u=row.username||'unknown',pr=prev.get(u);const isNew=pr===undefined,change=isNew?0:pr-rank;const commentary=getCommentary(rank,change,isNew);let cls=rank===1?'rank-1':rank===2?'rank-2':rank===3?'rank-3':change>=3?'rank-up-big':change<=-3?'rank-down-big':'';if(change>0)cls+=' flash-rank-up';const rankDisplay=rank===1?'🥇 1':rank===2?'🥈 2':rank===3?'🥉 3':rank;const changeDisplay=isNew?'<span class="change-new">🆕 NEW</span>':change>0?`<span class="change-up">▲ ${change}</span>`:change<0?`<span class="change-down">▼ ${Math.abs(change)}</span>`:'<span class="change-same">—</span>';if(change>=5)ticks.push(`🚀 @${u} が${rank}位急浮上！`);if(change<=-5)ticks.push(`⚠️ @${u} が${rank}位に急降下！`);const tr=document.createElement('tr');tr.className=cls;tr.innerHTML=`<td class="rank-cell">${rankDisplay}</td><td>${changeDisplay}</td><td class="username-cell">@${u}</td><td class="score-cell">${formatNumber(row.score)}</td><td class="stat-sec">${formatNumber(row.deployerScore)}</td><td class="stat-sec">${formatNumber(row.builderScore)}</td><td class="stat-sec">${formatNumber(row.socialScore)}</td><td class="stat-sec">${row.pnl||'N/A'}</td><td><span class="commentary-cell">${commentary}</span></td>`;tbody.appendChild(tr)});document.getElementById('updated-at').innerText=`最終更新: ${formatJST(meta)}`;document.getElementById('ticker-text').innerText=ticks.join(' | ')+' | '+ticks.join(' | ')}catch(e){console.error('Leaderboard render error:',e)}}
    setInterval(()=>{secondsLeft--;if(secondsLeft<=0){secondsLeft=900;loadLeaderboardData()}document.getElementById('countdown').innerText=secondsLeft},1000);if(window.bankr)bankr.on('ready',loadLeaderboardData);else document.addEventListener('DOMContentLoaded',loadLeaderboardData);
  </script>
</body>
</html>
